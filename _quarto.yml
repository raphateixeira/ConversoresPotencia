project:
  type: website
  output-dir: _site
  pre-render: scripts/empacota_projetos.py   # downloads/<Projeto>.zip de cada projeto do CCS
  resources:
    - downloads/*.zip
  render:
    - index.qmd
    # Conversor Buck (ex-ControleBuck + ensaios/firmware do ProjetosCCS)
    - Buck/Plano/PlanoIC01.qmd
    - Buck/Modelagem/ModelagemBuck.ipynb
    - Buck/Modelagem/Apresentacao.qmd
    - Buck/Apresentacao/Apresentacao.qmd
    - Buck/FonteControlada/Apresentacao.qmd
    - Buck/Ensaios/*/index.qmd
    # Inversor trifásico (ex-ControleInversor3f, ex-ControleVSI + ensaios/firmware do ProjetosCCS)
    - InversorTrifasico/PlanoIC03/PlanoIC03.qmd
    - InversorTrifasico/00Bancada/ModeloInversor/index.qmd
    - InversorTrifasico/SimulacoesMatlab/VSI*/index.qmd
    - InversorTrifasico/SimulacoesMatlab/Notas/Nota*.qmd
    - InversorTrifasico/0*/apresentacoes/*/index.qmd
    - InversorTrifasico/00Bancada/HardwareInversor/index.qmd
    # DFIG (ex-ControleDFIG)
    - DFIG/Presents/0*.qmd
    # Microrredes (ex-MicroGrids)
    - Microrredes/Notas/Nota*.qmd

execute:
  freeze: auto

