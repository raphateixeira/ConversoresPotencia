project:
  type: website
  output-dir: _site
  pre-render: scripts/empacota_projetos.py   # downloads/<Projeto>.zip de cada projeto do CCS (*/Firmware/*)
  resources:
    - downloads/*.zip
  render:
    - index.qmd
    # Conversor Buck (ex-ControleBuck + ensaios/firmware do ProjetosCCS)
    - Buck/Plano/PlanoIC01.qmd
    - Buck/Modelagem/ModelagemBuck.ipynb
    - Buck/Modelagem/Apresentacao.qmd
    - Buck/Apresentacao/Apresentacao.qmd
    - Buck/FonteControlada/Apresentacao.qmd
    - Buck/Ensaios/*/index.qmd
    # Inversor trifásico (ex-ControleInversor3f, ex-ControleVSI + ensaios/firmware do ProjetosCCS)
    - InversorTrifasico/CargaRL/Plano/PlanoIC03.qmd
    - InversorTrifasico/CargaRL/Notas/Nota01ModelagemVSI.qmd
    - InversorTrifasico/CargaRL/Bancada/carga_rl_trifasica.qmd
    - InversorTrifasico/ConectadoRede/VSI*/index.qmd
    - InversorTrifasico/ConectadoRede/Notas/Nota*.qmd
    - InversorTrifasico/Ensaios/*/index.qmd
    # Microrredes (ex-MicroGrids)
    - Microrredes/Notas/Nota*.qmd

execute:
  freeze: auto

website:
  title: "Conversores de Potência"
  description: "Modelagem, identificação e controle de conversores de potência — Prof. Dr. Raphael Teixeira (UFPA-CAMTUC-FEE)"
